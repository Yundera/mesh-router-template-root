name: mesh

# =============================================================================
# TRANSITION SHIM — remove one release after the key rename has rolled out.
#
# ${PROVIDER_STR:-${PROVIDER}} and ${DEFAULT_PWD:-${DEFAULT_PASSWORD}} below read
# the new key name and fall back to the old one.
#
# Why it is needed: on a box updating FROM a pre-rename template, the running
# self-check copies this compose file into place and brings the stack up in the
# SAME cycle — but the rename migration cannot have run yet (the old
# ensure-template-sync.sh has no migration support; it only gains it by
# installing the very tree that contains this file). Without the fallback, that
# cycle starts mesh-router-agent and -tunnel with an EMPTY provider string. The
# public URLs keep answering for the ~600s route TTL and then the box goes dark
# until the next nightly cycle — up to 24h. Observed on a real update before
# this shim existed.
#
# The rename lands on the following cycle, via the migration and the
# heal_renamed_key fallback in ensure-env-valid.sh. Once every supported box has
# been through that, drop the `:-${OLD}` halves.
# =============================================================================

services:
  mesh-router-tunnel:
    image: ghcr.io/yundera/mesh-router-tunnel:1.2.10
    container_name: mesh-router-tunnel
    hostname: mesh-router-tunnel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      - PROVIDER=${PROVIDER_STR:-${PROVIDER}}
      - ROUTING_TARGET_HOST=mesh-router-caddy
      # Dual-port support for transparent HTTP/HTTPS routing
      - ROUTING_TARGET_PORT_HTTPS=443
      - ROUTING_TARGET_PORT_HTTP=80
    networks:
      pcs: null
    depends_on:
      - mesh-router-caddy

  mesh-router-agent:
    image: ghcr.io/yundera/mesh-router-agent:1.0.11
    container_name: mesh-router-agent
    hostname: mesh-router-agent
    restart: unless-stopped
    environment:
      - PROVIDER=${PROVIDER_STR:-${PROVIDER}}
      - PUBLIC_IP=${PUBLIC_IP}
      # Dual-port support for transparent HTTP/HTTPS routing
      - TARGET_PORT_HTTPS=443
      - TARGET_PORT_HTTP=80
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/certs:/app/data
    networks:
      pcs: null

  mesh-router-caddy:
    image: ghcr.io/yundera/mesh-router-caddy:1.2.5
    container_name: mesh-router-caddy
    hostname: mesh-router-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Template-owned base config (global options, (gateway_tls), root-domain
      # routes). Mounted rather than using the image's baked copy so root-domain
      # behaviour can change with a template sync instead of an image bump —
      # same arrangement as Yundera/template-root. ensure-template-sync.sh puts
      # the file here BEFORE ensure-stack-up.sh runs; if it is ever missing,
      # Docker would create a directory at this path and Caddy would fail to
      # start, so both the sync and install.sh treat it as a required file.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/certs:/certs:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/data:/data
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/config:/config
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=pcs
      - PCS_EMAIL=${EMAIL}
      - DOMAIN=${DOMAIN}
      - PUBLIC_IP_DASH=${PUBLIC_IP_DASH}
      - DEFAULT_SERVICE_HOST=${DEFAULT_SERVICE_HOST:-maison}
      - DEFAULT_SERVICE_PORT=${DEFAULT_SERVICE_PORT:-80}
    networks:
      pcs: null
    depends_on:
      - mesh-router-agent

  smtp:
    image: ghcr.io/yundera/mail-gateway:1.0.4
    container_name: smtp
    hostname: smtp
    restart: unless-stopped
    environment:
      # The gateway parses the provider string: it accepts SMTP from apps on the pcs network
      # (host "smtp") and POSTs each email to {backend_url}/router/api/email/send with
      # "userid:signature" as the Bearer credential. mesh-router-backend verifies it and sends
      # from <app>.<user-domain>@<server-domain> (e.g. vaultwarden.alice@nsl.sh).
      - RELAY_CREDENTIAL=${PROVIDER_STR:-${PROVIDER}}
      - SMTP_PORT=587
    expose:
      - "587"
    networks:
      pcs: null

  dex:
    image: ghcr.io/dexidp/dex:v2.43.1
    container_name: dex
    hostname: dex
    restart: unless-stopped
    command: ["dex", "serve", "/data/config.yaml"]
    # If a connector's issuer is NOT served with a publicly-trusted cert (e.g. an
    # internal-CA-only test host), Dex's back-channel TLS to it will fail; in
    # that case ensure-dex.sh writes a CA bundle and you add:
    #   environment:
    #     SSL_CERT_FILE: /data/ca-bundle.crt
    volumes:
      # config.yaml (rendered) + dex.db (sqlite). This is CACHE, not precious
      # data — see the recovery note in scripts/self-check/ensure-dex.sh.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/dex:/data
    expose:
      - "5556"   # OIDC web endpoints (Caddy terminates TLS), bound on pcs
      - "5557"   # gRPC client-mgmt API — UNAUTHENTICATED, bound to dex-internal IP only
    networks:
      pcs: null
      # gRPC (5557) is bound to this static IP in config.yaml, so it is reachable
      # ONLY by containers on dex-internal (just auth-registrar).
      dex-internal:
        ipv4_address: 172.31.7.2
    # No depends_on: authelia is in this stack but Dex must not block on it, and
    # Dex retries a connector's back-channel on use, so cold-boot ordering
    # resolves itself.
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 5556}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 5556}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 5556}}"

  # =============================================================================
  # AUTHELIA - local-account IdP, federated by Dex as the "Local Account" connector
  # Owns the credential that used to live in CasaOS. Exactly ONE OIDC client (Dex);
  # per-app clients stay on Dex's gRPC path via auth-registrar. Serves its own
  # login UI at local-auth-${DOMAIN}, which carries the built-in "Reset password?"
  # link and drives the email reset through the smtp relay in this same stack.
  # Config + secrets + users_database.yml are provisioned by
  # scripts/self-check/ensure-authelia.sh into ${DATA_ROOT}/AppData/mesh/auth/.
  # =============================================================================
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset
    volumes:
      # configuration.yml (rendered) + db.sqlite + users_database.yml + secrets.
      # Unlike the dex dir this holds the local account — back it up.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/auth:/config
    expose:
      - "9091"
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed). Distinct host from Dex's
      # auth-${DOMAIN}: Dex is the broker, Authelia is the connector behind it.
      caddy_0: local-auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9091}}"
      # nip.io variant — REQUIRED: the CF worker rewrites Host to nip.io, so that
      # is the route CF traffic matches, and Dex's back-channel needs it to resolve.
      caddy_1: local-auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 9091}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: local-auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 9091}}"

  # =============================================================================
  # AUTH-REGISTRAR - OIDC client self-registration for PCS apps
  # Sidecars (e.g. the AppShield gate in the maison stack) POST their redirect
  # URIs to http://auth-registrar:9092/register on first login and get back
  # {client_id, client_secret, issuer_url}. Caller identity is derived from the
  # source IP via PTR lookup on the pcs network — client_id is never accepted as
  # input. Intentionally NOT publicly routable. In Dex mode it calls Dex's gRPC
  # CreateClient.
  #
  # STATELESS: the registrar's client-secret cache lives inside the container
  # (DEX_CLIENTS_DIR=/tmp/dex-clients) and is deliberately NOT persisted. Within a
  # container lifetime the cache makes re-registration idempotent (same secret);
  # after a restart it is empty and the registrar transparently rotates each
  # client's secret on its next /register. Apps re-register on every login, so
  # this is invisible.
  # =============================================================================
  auth-registrar:
    image: ghcr.io/yundera/mesh-auth:1.1.3
    container_name: auth-registrar
    hostname: auth-registrar
    restart: unless-stopped
    environment:
      ISSUER_URL: https://auth-${DOMAIN}
      REGISTRAR_BACKEND: dex
      # Dex gRPC is reachable only on the isolated dex-internal net (static IP)
      DEX_GRPC_ADDR: 172.31.7.2:5557
      # ephemeral in-container cache (NOT persisted) — see note above
      DEX_CLIENTS_DIR: /tmp/dex-clients
      # Allowed redirect-URI host suffixes (comma-separated). An app's permitted
      # hosts are <app>-<suffix> for each; the registrar verifies every requested
      # callback against this exact set. Must list the SAME suffixes the apps'
      # caddy_* labels use — the user domain plus the IP-based fallbacks.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
    expose:
      - "9092"
    networks:
      pcs: null            # /register from app sidecars + PTR attestation
      dex-internal: null   # gRPC to Dex
    depends_on:
      - dex

networks:
  pcs:
    name: pcs
  # Isolated gRPC-only net for the auth-registrar <-> Dex client-management API.
  # internal: true → no egress (Dex's egress comes from the pcs network it is also
  # on). App containers live only on pcs, so they cannot reach Dex's gRPC port
  # (5557), which is bound to 172.31.7.2 on this net. The subnet is pinned so Dex
  # can bind gRPC to a known IP — keep it clear of other host docker networks.
  dex-internal:
    name: dex-internal
    internal: true
    ipam:
      config:
        - subnet: 172.31.7.0/29

volumes:
  caddy_data:
  caddy_config:

# Maison reads this in preference to x-casaos, field by field. Without it the
# stack renders as a nameless, iconless tile: this project publishes no host port,
# so there is nothing for the dashboard to derive a URL from.
#
# `webui-host` is the only field Maison substitutes ${DOMAIN} into. The literal
# host below carries no placeholder, so it passes through untouched — which is
# what we want: the tile opens the NSL.sh management dashboard, not anything on
# this box.
x-compose-app:
  schema_version: 2
  id: mesh
  title: Mesh Router
  category: Utilities
  developer: Mesh Router NSL.sh
  icon: https://cdn.jsdelivr.net/gh/yundera/mesh-router-template-root@main/icon.png
  webui-host: nsl.sh
  webui-scheme: https
  webui-path: /dashboard

# Kept for any dashboard that reads the CasaOS metadata shape. `main` names the
# stack's primary service and must exist — it was `casaos` until that service was
# removed, which would have left the tile pointing at nothing.
x-casaos:
  main: mesh-router-caddy
  # Open the NSL.sh management dashboard, not anything local. The UI builds the
  # tile URL as ${scheme}://${hostname}${index}; without hostname it would fall
  # back to this PCS's own domain.
  hostname: nsl.sh
  index: /dashboard
  scheme: https
  is_uncontrolled: false
  store_app_id: mesh
  architectures:
    - amd64
    - arm64
  author: Mesh Router NSL.sh
  category: Utilities
  title:
    en_us: Mesh Router
  description:
    en_us: |
      Mesh router networking stack for Personal Cloud Servers. NSL.sh

      Includes WireGuard VPN tunneling, direct IP routing, Caddy reverse proxy
      with automatic SSL, Dex/Authelia SSO, and the Maison dashboard.
  icon: https://cdn.jsdelivr.net/gh/yundera/mesh-router-template-root@main/icon.png
  tagline:
    en_us: Secure mesh networking for your Personal Cloud Server
