name: mesh

# =============================================================================
# TRANSITION SHIM — remove one release after the key rename has rolled out.
#
# ${PROVIDER_STR:-${PROVIDER}} and ${DEFAULT_PWD:-${DEFAULT_PASSWORD}} below read
# the new key name and fall back to the old one.
#
# Why it is needed: on a box updating FROM a pre-rename template, the running
# self-check copies this compose file into place and brings the stack up in the
# SAME cycle — but the rename migration cannot have run yet (the old
# ensure-template-sync.sh has no migration support; it only gains it by
# installing the very tree that contains this file). Without the fallback, that
# cycle starts mesh-router-agent and -tunnel with an EMPTY provider string. The
# public URLs keep answering for the ~600s route TTL and then the box goes dark
# until the next nightly cycle — up to 24h. Observed on a real update before
# this shim existed.
#
# The rename lands on the following cycle, via the migration and the
# heal_renamed_key fallback in ensure-env-valid.sh. Once every supported box has
# been through that, drop the `:-${OLD}` halves.
# =============================================================================

services:
  mesh-router-tunnel:
    image: ghcr.io/yundera/mesh-router-tunnel:1.3.0
    container_name: mesh-router-tunnel
    hostname: mesh-router-tunnel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      - PROVIDER=${PROVIDER_STR:-${PROVIDER}}
      - ROUTING_TARGET_HOST=mesh-router-caddy
      # Dual-port support for transparent HTTP/HTTPS routing
      - ROUTING_TARGET_PORT_HTTPS=443
      - ROUTING_TARGET_PORT_HTTP=80
    networks:
      pcs: null
    depends_on:
      - mesh-router-caddy

  mesh-router-agent:
    image: ghcr.io/yundera/mesh-router-agent:1.1.1
    container_name: mesh-router-agent
    hostname: mesh-router-agent
    restart: unless-stopped
    environment:
      - PROVIDER=${PROVIDER_STR:-${PROVIDER}}
      - PUBLIC_IP=${PUBLIC_IP}
      # Dual-port support for transparent HTTP/HTTPS routing
      - TARGET_PORT_HTTPS=443
      - TARGET_PORT_HTTP=80
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/certs:/app/data
    networks:
      pcs: null

  mesh-router-caddy:
    image: ghcr.io/yundera/mesh-router-caddy:1.2.6
    container_name: mesh-router-caddy
    hostname: mesh-router-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Template-owned base config (global options, (gateway_tls), root-domain
      # routes). Mounted rather than using the image's baked copy so root-domain
      # behaviour can change with a template sync instead of an image bump —
      # same arrangement as Yundera/template-root. ensure-template-sync.sh puts
      # the file here BEFORE ensure-stack-up.sh runs; if it is ever missing,
      # Docker would create a directory at this path and Caddy would fail to
      # start, so both the sync and install.sh treat it as a required file.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/certs:/certs:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/data:/data
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/config:/config
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=pcs
      - PCS_EMAIL=${EMAIL}
      - DOMAIN=${DOMAIN}
      - PUBLIC_IP_DASH=${PUBLIC_IP_DASH}
      - DEFAULT_SERVICE_HOST=${DEFAULT_SERVICE_HOST:-maison}
      - DEFAULT_SERVICE_PORT=${DEFAULT_SERVICE_PORT:-80}
    networks:
      pcs: null
    depends_on:
      - mesh-router-agent

  smtp:
    image: ghcr.io/yundera/mail-gateway:1.1.0
    container_name: smtp
    hostname: smtp
    restart: unless-stopped
    environment:
      # The gateway parses the provider string: it accepts SMTP from apps on the pcs network
      # (host "smtp") and POSTs each email to {backend_url}/router/api/email/send with
      # "userid:signature" as the Bearer credential. mesh-router-backend verifies it and sends
      # from <app>.<user-domain>@<server-domain> (e.g. vaultwarden.alice@nsl.sh).
      - RELAY_CREDENTIAL=${PROVIDER_STR:-${PROVIDER}}
      - SMTP_PORT=587
    expose:
      - "587"
    volumes:
      # Delivery stats for the Email page of Mesh Console (mail-gateway >= 1.1.0).
      - smtp-data:/data
    networks:
      pcs: null

  # =============================================================================
  # MESH CONSOLE - the stack's web UI (github.com/Yundera/mesh-console)
  # IP and domain, how the gateways route to this box (direct / tunnel /
  # offline), whether the template is up to date with an "Update now" that runs
  # the self-check, and which app the root domain serves. It is what the Mesh
  # Router tile opens (x-compose-app below), so it lives in this stack rather
  # than in a project of its own — a separate project showed up in Maison as a
  # second, unrelated platform tile.
  #
  # SECURITY — read before changing either service:
  #   - mesh-console-app holds the Docker socket, i.e. root on this host, and
  #     uses it to run a small fixed set of host actions. The AppShield gate is
  #     the ONLY route in. Never add a `ports:` mapping to either service.
  #   - Admins only, enforced twice: the gate refuses any account outside
  #     `admins` (OIDC_REQUIRED_GROUPS), and the app independently verifies the
  #     gate's signed identity assertion (IDENTITY_ASSERTION_SECRET) and the group
  #     again. The app cannot trust plain headers: every app container on `pcs`
  #     can reach it.
  #
  # MESH_CONSOLE_ASSERTION_SECRET is minted into .env by
  # scripts/self-check/ensure-stack-up.sh. Unset, the app refuses every
  # request — it fails closed, never open.
  #
  # NAMING IS LOAD-BEARING, exactly as for the maison stack: the auth-registrar
  # derives the OIDC client_id from a PTR lookup of the calling container's name
  # and only issues redirect URIs under `<client_id>-<suffix>`, so the gate owns
  # the public name `mesh-console` and the backend takes the `-app` suffix.
  # AppShield also derives the assertion audience (APP_NAME) from this hostname,
  # which is why the app verifies aud=mesh-console.
  # =============================================================================
  mesh-console:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: mesh-console
    hostname: mesh-console
    restart: unless-stopped
    # Root, like the maison gate: the gate-data dir is created by Docker as root,
    # and a non-root gate silently fails to persist sessions there.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    expose:
      - "80"
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Fallback only — the registrar's own REDIRECT_HOST_SUFFIXES decides. Keep it
      # matching the caddy_* labels below.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "mesh-console-app"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      SESSION_DURATION_HOURS: "720"
      # Everything on this page is an admin action, so unlike admin-app (which
      # lets a non-admin reach its Account panel) the group is enforced at the gate.
      OIDC_REQUIRED_GROUPS: "admins"
      # Shared with mesh-console-app, which verifies the X-AppShield-Assertion the
      # gate signs with it.
      IDENTITY_ASSERTION_SECRET: "${MESH_CONSOLE_ASSERTION_SECRET}"
      # The only path that answers without a login: a liveness probe, no data.
      ALLOWED_PATHS: "api/health"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/mesh/mesh-console/gate-data:/data
    # Not auth-registrar: it is in the auth stack now, and depends_on cannot name
    # another project's service. Nothing is lost — the gate registers on first
    # login, not at start, and retries then.
    depends_on:
      - mesh-console-app
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: mesh-console-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: mesh-console-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: mesh-console-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

  mesh-console-app:
    image: ghcr.io/yundera/mesh-console:1.1.0
    container_name: mesh-console-app
    hostname: mesh-console-app
    restart: unless-stopped
    # Root: it reads the mesh .env (mode 600, owned by PUID) and talks to the
    # Docker socket. The socket already makes it root-equivalent on the host.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    environment:
      IDENTITY_ASSERTION_SECRET: "${MESH_CONSOLE_ASSERTION_SECRET}"
      IDENTITY_ASSERTION_AUDIENCE: "mesh-console"
      # The mesh root as the HOST sees it. Host actions run in the host's mount
      # namespace, so they need this path, not the /mesh mount below.
      MESH_HOST_ROOT: "${DATA_ROOT:-/DATA}/AppData/mesh"
      # The compose projects the console lists as platform containers. `auth`
      # joined at the split — dex, authelia and auth-registrar used to be listed
      # under `mesh` and would otherwise drop out of the Stack page.
      PLATFORM_PROJECTS: "mesh,auth,maison,mesh-console"
    expose:
      - "8080"   # NEVER `ports:` — see the security note above
    networks:
      pcs: null
    volumes:
      # Read-only: .env, log/mesh.log, data/certs/cert.pem, template/.revision.json.
      # Every write goes through a host action, never through this mount.
      - ${DATA_ROOT:-/DATA}/AppData/mesh:/mesh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The self-check log is written in host local time and the console parses
      # it in time.Local — the host's zone, without a TZ key to keep in .env.
      - /etc/localtime:/etc/localtime:ro

networks:
  # EXTERNAL since the auth split: created by ensure_pcs_network
  # (scripts/library/common.sh) before any stack comes up, and owned by none of
  # them. Every stack — this one, auth, maison, terminal — joins it the same way,
  # so no stack has to come up first and `down` on this one no longer tries to
  # delete a network the others are attached to. On a box set up before the split
  # the network still carries this project's labels; an external user ignores
  # them. (dex-internal, Dex's gRPC-only net, moved to the auth stack with Dex.)
  pcs:
    name: pcs
    external: true

volumes:
  caddy_data:
  caddy_config:
  smtp-data:

# Maison reads this in preference to x-casaos, field by field. Without it the
# stack renders as a nameless, iconless tile: this project publishes no host port,
# so there is nothing for the dashboard to derive a URL from.
#
# The tile opens Mesh Console, this stack's own web UI — through its gate, the
# only authenticated way in. `webui-host` is the only field Maison substitutes
# ${DOMAIN} into; it must match the mesh-console service's caddy_0.
x-compose-app:
  schema_version: 2
  id: mesh
  title: Mesh Router
  category: Utilities
  developer: Mesh Router NSL.sh
  # The mesh stack is platform, not an app. Since the phase-3 move to
  # ${DATA_ROOT}/AppData/mesh it is a MANAGED Maison tile (Maison's managed scan
  # is stat(${DATA_ROOT}/AppData/<name>/docker-compose.yml)), so without this it
  # is offered for stop/uninstall like any store app — which would take the whole
  # platform down. Replaces the PROTECTED_APPS env that Maison dropped at 1.1.5;
  # inert on older images. Restart stays available.
  view: system
  icon: https://cdn.jsdelivr.net/gh/yundera/mesh-router-template-root@main/icon.png
  webui-host: mesh-console-${DOMAIN}
  webui-scheme: https
  webui-path: /

# Kept for any dashboard that reads the CasaOS metadata shape. `main` names the
# stack's primary service and must exist — it was `casaos` until that service was
# removed, which would have left the tile pointing at nothing.
x-casaos:
  main: mesh-console
  # Open Mesh Console, the stack's web UI. The UI builds the tile URL as
  # ${scheme}://${hostname}${index}; without hostname it would fall back to this
  # PCS's own domain.
  hostname: mesh-console-${DOMAIN}
  index: /
  scheme: https
  is_uncontrolled: false
  store_app_id: mesh
  architectures:
    - amd64
    - arm64
  author: Mesh Router NSL.sh
  category: Utilities
  title:
    en_us: Mesh Router
  description:
    en_us: |
      Mesh router networking stack for Personal Cloud Servers. NSL.sh

      Includes WireGuard VPN tunneling, direct IP routing, Caddy reverse proxy
      with automatic SSL, the mail relay, and Mesh Console, the stack's web UI
      (status, routing, updates, root-domain app). SSO (Dex/Authelia) is the
      separate `auth` stack.
  icon: https://cdn.jsdelivr.net/gh/yundera/mesh-router-template-root@main/icon.png
  tagline:
    en_us: Secure mesh networking for your Personal Cloud Server
