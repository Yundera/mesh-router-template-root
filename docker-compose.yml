name: mesh

# =============================================================================
# TRANSITION SHIM — remove one release after the key rename has rolled out.
#
# ${PROVIDER_STR:-${PROVIDER}} and ${DEFAULT_PWD:-${DEFAULT_PASSWORD}} below read
# the new key name and fall back to the old one.
#
# Why it is needed: on a box updating FROM a pre-rename template, the running
# self-check copies this compose file into place and brings the stack up in the
# SAME cycle — but the rename migration cannot have run yet (the old
# ensure-template-sync.sh has no migration support; it only gains it by
# installing the very tree that contains this file). Without the fallback, that
# cycle starts mesh-router-agent and -tunnel with an EMPTY provider string. The
# public URLs keep answering for the ~600s route TTL and then the box goes dark
# until the next nightly cycle — up to 24h. Observed on a real update before
# this shim existed.
#
# The rename lands on the following cycle, via the migration and the
# heal_renamed_key fallback in ensure-env-valid.sh. Once every supported box has
# been through that, drop the `:-${OLD}` halves.
# =============================================================================

services:
  mesh-router-tunnel:
    image: ghcr.io/yundera/mesh-router-tunnel:1.3.0
    container_name: mesh-router-tunnel
    hostname: mesh-router-tunnel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      - PROVIDER=${PROVIDER_STR:-${PROVIDER}}
      - ROUTING_TARGET_HOST=mesh-router-caddy
      # Dual-port support for transparent HTTP/HTTPS routing
      - ROUTING_TARGET_PORT_HTTPS=443
      - ROUTING_TARGET_PORT_HTTP=80
    networks:
      pcs: null
    depends_on:
      - mesh-router-caddy

  mesh-router-agent:
    image: ghcr.io/yundera/mesh-router-agent:1.1.1
    container_name: mesh-router-agent
    hostname: mesh-router-agent
    restart: unless-stopped
    environment:
      - PROVIDER=${PROVIDER_STR:-${PROVIDER}}
      - PUBLIC_IP=${PUBLIC_IP}
      # Dual-port support for transparent HTTP/HTTPS routing
      - TARGET_PORT_HTTPS=443
      - TARGET_PORT_HTTP=80
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/certs:/app/data
    networks:
      pcs: null

  mesh-router-caddy:
    image: ghcr.io/yundera/mesh-router-caddy:1.2.6
    container_name: mesh-router-caddy
    hostname: mesh-router-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Template-owned base config (global options, (gateway_tls), root-domain
      # routes). Mounted rather than using the image's baked copy so root-domain
      # behaviour can change with a template sync instead of an image bump —
      # same arrangement as Yundera/template-root. ensure-template-sync.sh puts
      # the file here BEFORE ensure-stack-up.sh runs; if it is ever missing,
      # Docker would create a directory at this path and Caddy would fail to
      # start, so both the sync and install.sh treat it as a required file.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/certs:/certs:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/data:/data
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/config:/config
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=pcs
      - PCS_EMAIL=${EMAIL}
      - DOMAIN=${DOMAIN}
      - PUBLIC_IP_DASH=${PUBLIC_IP_DASH}
      - DEFAULT_SERVICE_HOST=${DEFAULT_SERVICE_HOST:-maison}
      - DEFAULT_SERVICE_PORT=${DEFAULT_SERVICE_PORT:-80}
    networks:
      pcs: null
    depends_on:
      - mesh-router-agent

  smtp:
    image: ghcr.io/yundera/mail-gateway:1.0.4
    container_name: smtp
    hostname: smtp
    restart: unless-stopped
    environment:
      # The gateway parses the provider string: it accepts SMTP from apps on the pcs network
      # (host "smtp") and POSTs each email to {backend_url}/router/api/email/send with
      # "userid:signature" as the Bearer credential. mesh-router-backend verifies it and sends
      # from <app>.<user-domain>@<server-domain> (e.g. vaultwarden.alice@nsl.sh).
      - RELAY_CREDENTIAL=${PROVIDER_STR:-${PROVIDER}}
      - SMTP_PORT=587
    expose:
      - "587"
    networks:
      pcs: null

  dex:
    # PINNED BY DIGEST TO A `master` BUILD, DELIBERATELY — not a release tag.
    #
    # The logout features this stack depends on are merged upstream but
    # UNRELEASED: RP-Initiated Logout (PR #4674) and Back-Channel Logout with a
    # `sid` claim (PR #4945). The newest release, v2.45.1, predates both and
    # advertises no logout of any kind — which is why "log out" could not log
    # anybody out.
    #
    # By DIGEST and not `:master`, because `:master` is a moving tag: every push
    # to trunk would silently reach every box on the next ensure-stack-pulled.sh.
    # This digest is the 2026-08-06 build, verified to advertise
    # end_session_endpoint + backchannel_logout_supported, and to be multi-arch
    # (amd64, arm64, arm, ppc64le, s390x).
    #
    # REPIN TO A RELEASE as soon as one ships with both PRs (expected > v2.45.1).
    # The delta from v2.45.1 is large — trunk restructured server/ into logout/,
    # backchannel/, discovery/, consent/, mfa/ packages — so this is a bigger
    # unreleased surface than "a logout patch" implies.
    image: ghcr.io/dexidp/dex@sha256:af9469509350ff3f6ca70127175a58e5ab085b9d18740fa4a590d9f03f0a026b
    container_name: dex
    hostname: dex
    restart: unless-stopped
    command: ["dex", "serve", "/data/config.yaml"]
    environment:
      # Gates the whole `sessions:` block in dex.config.yaml.tmpl. Dex REFUSES TO
      # START with a sessions config and this unset ("sessions config requires
      # sessions to be enabled"), so the two must move together.
      #
      # Turning it on gives Dex a real `dex_session` browser cookie, which is
      # what makes it an OP you can log out of.
      DEX_SESSIONS_ENABLED: "true"
    # If a connector's issuer is NOT served with a publicly-trusted cert (e.g. an
    # internal-CA-only test host), Dex's back-channel TLS to it will fail; in
    # that case ensure-dex.sh writes a CA bundle and you add:
    #     SSL_CERT_FILE: /data/ca-bundle.crt
    # to the environment block above.
    volumes:
      # config.yaml (rendered) + dex.db (sqlite). This is CACHE, not precious
      # data — see the recovery note in scripts/self-check/ensure-dex.sh.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/dex:/data
      # Custom login frontend, overlaid onto the stock image. ensure-dex.sh (via
      # tools/provision-dex-frontend.sh) renders these from the template's
      # dex-theme/ before the stack comes up. Docker materialises a MISSING
      # bind-mount source as a DIRECTORY, and a directory where login.html
      # belongs breaks `dex` permanently — which is why that tool also runs from
      # ensure-stack-up.sh.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/dex-frontend/templates/login.html:/srv/dex/web/templates/login.html:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/dex-frontend/templates/header.html:/srv/dex/web/templates/header.html:ro
      - ${DATA_ROOT:-/DATA}/AppData/mesh/dex-frontend/themes/mesh:/srv/dex/web/themes/mesh:ro
    expose:
      - "5556"   # OIDC web endpoints (Caddy terminates TLS), bound on pcs
      - "5557"   # gRPC client-mgmt API — UNAUTHENTICATED, bound to dex-internal only
    networks:
      pcs: null
      # gRPC (5557) is bound to `dex-grpc` in config.yaml, so it is reachable
      # ONLY by containers on dex-internal (just auth-registrar).
      #
      # THE ALIAS IS THE WHOLE MECHANISM, and it must stay network-scoped. Dex is
      # multi-homed, so binding to its own container name is ambiguous — Docker's
      # embedded DNS answers from the *querying* container's perspective and can
      # hand back the `pcs`-side address, which would publish an unauthenticated
      # client-minting API to every app on the box. An alias declared here and
      # nowhere else exists in exactly one network's DNS scope, so it has exactly
      # one A record and `net.Listen` can only bind to the dex-internal interface.
      #
      # This replaced a pinned ipv4_address (172.31.7.2 on a /29). That address
      # was also the first one Docker's IPAM hands out dynamically, so any cycle
      # where auth-registrar attached while Dex was between restarts stole it and
      # wedged Dex forever on "Address already in use". There is no pinned address
      # left to collide over; do not reintroduce one.
      dex-internal:
        aliases:
          - dex-grpc
    # No depends_on: authelia is in this stack but Dex must not block on it, and
    # Dex retries a connector's back-channel on use, so cold-boot ordering
    # resolves itself.
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 5556}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 5556}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 5556}}"

  # =============================================================================
  # AUTHELIA - local-account IdP, federated by Dex as the "Local Account" connector
  # Owns the credential that used to live in CasaOS. Exactly ONE OIDC client (Dex);
  # per-app clients stay on Dex's gRPC path via auth-registrar. Serves its own
  # login UI at local-auth-${DOMAIN}, which carries the built-in "Reset password?"
  # link and drives the email reset through the smtp relay in this same stack.
  # Config + secrets + users_database.yml are provisioned by
  # scripts/self-check/ensure-authelia.sh into ${DATA_ROOT}/AppData/mesh/auth/.
  # =============================================================================
  authelia:
    # NEVER LOWER THIS PIN. Authelia migrates db.sqlite forward on every start and
    # an older binary cannot open the result — it exits with a misleading "the
    # configured encryption key does not appear to be valid for this database".
    # The floating 4.39 tag took boxes to 4.39.21/.22 (schema 25-28), and the
    # 4.39.20 pin that followed took every one of them offline. 4.39.23 added
    # schema 29, so nothing below 4.39.23 is safe for the fleet any more.
    # ensure-stack-up.sh raises a pin that is behind a box's database, but that
    # is a safety net, not permission. Keep AUTHELIA_IMAGE in
    # self-check/ensure-authelia.sh and tools/authelia-user-manager.sh in step.
    image: authelia/authelia:4.39.25
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset
    volumes:
      # configuration.yml (rendered) + db.sqlite + users_database.yml + secrets.
      # Unlike the dex dir this holds the local account — back it up.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/auth:/config
    expose:
      - "9091"
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed). Distinct host from Dex's
      # auth-${DOMAIN}: Dex is the broker, Authelia is the connector behind it.
      caddy_0: local-auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9091}}"
      # nip.io variant — REQUIRED: the CF worker rewrites Host to nip.io, so that
      # is the route CF traffic matches, and Dex's back-channel needs it to resolve.
      caddy_1: local-auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 9091}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: local-auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 9091}}"

  # =============================================================================
  # AUTH-REGISTRAR - OIDC client self-registration for PCS apps
  # Sidecars (e.g. the AppShield gate in the maison stack) POST their redirect
  # URIs to http://auth-registrar:9092/register on first login and get back
  # {client_id, client_secret, issuer_url}. Caller identity is derived from the
  # source IP via PTR lookup on the pcs network — client_id is never accepted as
  # input. Intentionally NOT publicly routable. In Dex mode it calls Dex's gRPC
  # CreateClient.
  #
  # STATELESS: the registrar's client-secret cache lives inside the container
  # (DEX_CLIENTS_DIR=/tmp/dex-clients) and is deliberately NOT persisted. Within a
  # container lifetime the cache makes re-registration idempotent (same secret);
  # after a restart it is empty and the registrar transparently rotates each
  # client's secret on its next /register. Apps re-register on every login, so
  # this is invisible.
  # =============================================================================
  auth-registrar:
    image: ghcr.io/yundera/mesh-auth:1.1.6
    container_name: auth-registrar
    hostname: auth-registrar
    restart: unless-stopped
    environment:
      ISSUER_URL: https://auth-${DOMAIN}
      REGISTRAR_BACKEND: dex
      # Dex gRPC is reachable only on the isolated dex-internal net, via the
      # network-scoped `dex-grpc` alias declared on the dex service (no fixed
      # address needed — the registrar dials the alias).
      DEX_GRPC_ADDR: dex-grpc:5557
      # ephemeral in-container cache (NOT persisted) — see note above
      DEX_CLIENTS_DIR: /tmp/dex-clients
      # Allowed redirect-URI host suffixes (comma-separated). An app's permitted
      # hosts are <app>-<suffix> for each; the registrar verifies every requested
      # callback against this exact set. Must list the SAME suffixes the apps'
      # caddy_* labels use — the user domain plus the IP-based fallbacks.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      # The one app allowed to register callbacks on the BARE suffixes
      # (${DOMAIN} itself, not just <app>-${DOMAIN}) — i.e. whoever the root
      # domain reverse-proxies to in the Caddyfile.
      #
      # Deliberately the SAME variable that drives that Caddy block: "the app
      # that owns the bare hostname" and "the app the bare hostname routes to"
      # are then one fact rather than two settings that can drift.
      #
      # It is a proxy upstream target, not an identity: `host.docker.internal`
      # is legal here and is not a container name. The registrar validates it
      # and falls back to "nobody owns the bare hosts" rather than guessing —
      # check the `root app:` line in `docker logs auth-registrar` if a login on
      # the bare domain still lands on <app>-${DOMAIN}.
      #
      # Needs mesh-auth >= 1.1.4; older images ignore this and apps keep the
      # pre-existing bounce-to-<app>-${DOMAIN} behaviour.
      ROOT_CLIENT_ID: "${DEFAULT_SERVICE_HOST:-maison}"
    expose:
      - "9092"
    networks:
      pcs: null            # /register from app sidecars + PTR attestation
      dex-internal: null   # gRPC to Dex
    depends_on:
      - dex

  # =============================================================================
  # MESH CONSOLE - the stack's web UI (github.com/Yundera/mesh-console)
  # IP and domain, how the gateways route to this box (direct / tunnel /
  # offline), whether the template is up to date with an "Update now" that runs
  # the self-check, and which app the root domain serves. It is what the Mesh
  # Router tile opens (x-compose-app below), so it lives in this stack rather
  # than in a project of its own — a separate project showed up in Maison as a
  # second, unrelated platform tile.
  #
  # SECURITY — read before changing either service:
  #   - mesh-console-app holds the Docker socket, i.e. root on this host, and
  #     uses it to run a small fixed set of host actions. The AppShield gate is
  #     the ONLY route in. Never add a `ports:` mapping to either service.
  #   - Admins only, enforced twice: the gate refuses any account outside
  #     `admins` (OIDC_REQUIRED_GROUPS), and the app independently verifies the
  #     gate's signed identity assertion (IDENTITY_ASSERTION_SECRET) and the group
  #     again. The app cannot trust plain headers: every app container on `pcs`
  #     can reach it.
  #
  # MESH_CONSOLE_ASSERTION_SECRET is minted into .env by
  # scripts/self-check/ensure-stack-up.sh. Unset, the app refuses every
  # request — it fails closed, never open.
  #
  # NAMING IS LOAD-BEARING, exactly as for the maison stack: the auth-registrar
  # derives the OIDC client_id from a PTR lookup of the calling container's name
  # and only issues redirect URIs under `<client_id>-<suffix>`, so the gate owns
  # the public name `mesh-console` and the backend takes the `-app` suffix.
  # AppShield also derives the assertion audience (APP_NAME) from this hostname,
  # which is why the app verifies aud=mesh-console.
  # =============================================================================
  mesh-console:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: mesh-console
    hostname: mesh-console
    restart: unless-stopped
    # Root, like the maison gate: the gate-data dir is created by Docker as root,
    # and a non-root gate silently fails to persist sessions there.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    expose:
      - "80"
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Fallback only — the registrar's own REDIRECT_HOST_SUFFIXES decides. Keep it
      # matching the caddy_* labels below.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "mesh-console-app"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      SESSION_DURATION_HOURS: "720"
      # Everything on this page is an admin action, so unlike admin-app (which
      # lets a non-admin reach its Account panel) the group is enforced at the gate.
      OIDC_REQUIRED_GROUPS: "admins"
      # Shared with mesh-console-app, which verifies the X-AppShield-Assertion the
      # gate signs with it.
      IDENTITY_ASSERTION_SECRET: "${MESH_CONSOLE_ASSERTION_SECRET}"
      # The only path that answers without a login: a liveness probe, no data.
      ALLOWED_PATHS: "api/health"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/mesh/mesh-console/gate-data:/data
    depends_on:
      - mesh-console-app
      - auth-registrar
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: mesh-console-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: mesh-console-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: mesh-console-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

  mesh-console-app:
    image: ghcr.io/yundera/mesh-console:1.0.0
    container_name: mesh-console-app
    hostname: mesh-console-app
    restart: unless-stopped
    # Root: it reads the mesh .env (mode 600, owned by PUID) and talks to the
    # Docker socket. The socket already makes it root-equivalent on the host.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    environment:
      IDENTITY_ASSERTION_SECRET: "${MESH_CONSOLE_ASSERTION_SECRET}"
      IDENTITY_ASSERTION_AUDIENCE: "mesh-console"
      # The mesh root as the HOST sees it. Host actions run in the host's mount
      # namespace, so they need this path, not the /mesh mount below.
      MESH_HOST_ROOT: "${DATA_ROOT:-/DATA}/AppData/mesh"
    expose:
      - "8080"   # NEVER `ports:` — see the security note above
    networks:
      pcs: null
    volumes:
      # Read-only: .env, log/mesh.log, data/certs/cert.pem, template/.revision.json.
      # Every write goes through a host action, never through this mount.
      - ${DATA_ROOT:-/DATA}/AppData/mesh:/mesh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The self-check log is written in host local time and the console parses
      # it in time.Local — the host's zone, without a TZ key to keep in .env.
      - /etc/localtime:/etc/localtime:ro

networks:
  pcs:
    name: pcs
  # Isolated gRPC-only net for the auth-registrar <-> Dex client-management API.
  # internal: true → no egress (Dex's egress comes from the pcs network it is also
  # on). App containers live only on pcs, so they cannot reach Dex's gRPC port
  # (5557), which is bound to the `dex-grpc` alias on this net.
  #
  # NO ipam BLOCK, DELIBERATELY. Addressing here is entirely dynamic: Dex is found
  # by its network-scoped alias, not by a pinned address, so there is no reserved
  # IP for the dynamic allocator to collide with and no subnet to keep clear of
  # other host docker networks. See the alias note on the dex service.
  #
  # Docker will NOT re-create an existing network with changed IPAM, so boxes that
  # already have the old /29 need the stale bridge swept —
  # scripts/migrations/2026-09-07-10-drop-dex-internal-ipam.sh does that.
  dex-internal:
    name: dex-internal
    internal: true

volumes:
  caddy_data:
  caddy_config:

# Maison reads this in preference to x-casaos, field by field. Without it the
# stack renders as a nameless, iconless tile: this project publishes no host port,
# so there is nothing for the dashboard to derive a URL from.
#
# The tile opens Mesh Console, this stack's own web UI — through its gate, the
# only authenticated way in. `webui-host` is the only field Maison substitutes
# ${DOMAIN} into; it must match the mesh-console service's caddy_0.
x-compose-app:
  schema_version: 2
  id: mesh
  title: Mesh Router
  category: Utilities
  developer: Mesh Router NSL.sh
  # The mesh stack is platform, not an app. Since the phase-3 move to
  # ${DATA_ROOT}/AppData/mesh it is a MANAGED Maison tile (Maison's managed scan
  # is stat(${DATA_ROOT}/AppData/<name>/docker-compose.yml)), so without this it
  # is offered for stop/uninstall like any store app — which would take the whole
  # platform down. Replaces the PROTECTED_APPS env that Maison dropped at 1.1.5;
  # inert on older images. Restart stays available.
  view: system
  icon: https://cdn.jsdelivr.net/gh/yundera/mesh-router-template-root@main/icon.png
  webui-host: mesh-console-${DOMAIN}
  webui-scheme: https
  webui-path: /

# Kept for any dashboard that reads the CasaOS metadata shape. `main` names the
# stack's primary service and must exist — it was `casaos` until that service was
# removed, which would have left the tile pointing at nothing.
x-casaos:
  main: mesh-console
  # Open Mesh Console, the stack's web UI. The UI builds the tile URL as
  # ${scheme}://${hostname}${index}; without hostname it would fall back to this
  # PCS's own domain.
  hostname: mesh-console-${DOMAIN}
  index: /
  scheme: https
  is_uncontrolled: false
  store_app_id: mesh
  architectures:
    - amd64
    - arm64
  author: Mesh Router NSL.sh
  category: Utilities
  title:
    en_us: Mesh Router
  description:
    en_us: |
      Mesh router networking stack for Personal Cloud Servers. NSL.sh

      Includes WireGuard VPN tunneling, direct IP routing, Caddy reverse proxy
      with automatic SSL, Dex/Authelia SSO, and Mesh Console, the stack's web UI
      (status, routing, updates, root-domain app).
  icon: https://cdn.jsdelivr.net/gh/yundera/mesh-router-template-root@main/icon.png
  tagline:
    en_us: Secure mesh networking for your Personal Cloud Server
