# =============================================================================
# AUTH STACK — the box's identity layer: Dex (the OIDC broker every app logs in
# through), Authelia (the local account behind Dex's "Local Account" connector)
# and auth-registrar (per-app OIDC client self-registration).
#
# Deployed to ${DATA_ROOT}/AppData/auth by scripts/self-check/ensure-auth-stack.sh,
# which renders nothing itself: ensure-authelia.sh and ensure-dex.sh have already
# written every config file these services read, and deploy-stack.sh generates the
# .env beside the deployed copy from the mesh .env. DO NOT edit the deployed copy —
# it is overwritten on every self-check.
#
# SPLIT OUT OF THE MESH STACK. Container names, hostnames, labels and env are
# exactly what they were in the mesh compose file, and every other container
# still reaches these by name on `pcs`. The first `up` of this project evicts the
# mesh-project containers holding the same names (evict_name_squatters) and
# recreates them here.
#
# THE STATE IS IN THIS STACK'S FOLDER: Authelia's in ${DATA_ROOT}/AppData/auth/authelia
# and Dex's in ${DATA_ROOT}/AppData/auth/dex (its rendered login theme inside it,
# under frontend/). Until 2026-10-01 both sat in the mesh root (auth/, dex/,
# dex-frontend/); adopt_auth_state (scripts/library/common.sh) renames them across
# on a box that still has them there, before this file is brought up.
#
# Needs the mesh stack for four things, all by name or by path, none by
# depends_on (which cannot cross projects): mesh-router-caddy routes auth-${DOMAIN}
# and local-auth-${DOMAIN} (and is what Dex's on-box issuer pin terminates on),
# mesh-router-agent writes the mesh CA Dex trusts
# (${DATA_ROOT}/AppData/mesh/data/ca), smtp relays Authelia's password-reset mail, and the
# `pcs` network — external here as in every stack — is created before either
# stack comes up (ensure_pcs_network).
#
# AUTH-CONSOLE (Yundera/auth-console) is this stack's web UI and the tile's target:
# the local accounts (Authelia users) and who can reach the host over SSH. An
# AppShield gate named `auth-console` plus its backend `auth-console-app`, public
# at auth-console-${DOMAIN}. NOT `auth-${DOMAIN}`: Dex owns that host, and the
# registrar derives a gate's client_id — and so its callback hosts — from the
# container name. The console is optional to login: if it is down, Dex, Authelia
# and the registrar keep serving every other app.
# =============================================================================
name: auth

services:
  dex:
    # PINNED BY DIGEST TO A `master` BUILD, DELIBERATELY — not a release tag.
    #
    # The logout features this stack depends on are merged upstream but
    # UNRELEASED: RP-Initiated Logout (PR #4674) and Back-Channel Logout with a
    # `sid` claim (PR #4945). The newest release, v2.45.1, predates both and
    # advertises no logout of any kind — which is why "log out" could not log
    # anybody out.
    #
    # By DIGEST and not `:master`, because `:master` is a moving tag: every push
    # to trunk would silently reach every box on the next ensure-stack-pulled.sh.
    # This digest is the 2026-08-06 build, verified to advertise
    # end_session_endpoint + backchannel_logout_supported, and to be multi-arch
    # (amd64, arm64, arm, ppc64le, s390x).
    #
    # REPIN TO A RELEASE as soon as one ships with both PRs (expected > v2.45.1).
    # The delta from v2.45.1 is large — trunk restructured server/ into logout/,
    # backchannel/, discovery/, consent/, mfa/ packages — so this is a bigger
    # unreleased surface than "a logout patch" implies.
    image: ghcr.io/dexidp/dex@sha256:af9469509350ff3f6ca70127175a58e5ab085b9d18740fa4a590d9f03f0a026b
    container_name: dex
    hostname: dex
    cpu_shares: 80
    restart: unless-stopped
    command: ["dex", "serve", "/data/config.yaml"]
    environment:
      # Gates the whole `sessions:` block in dex.config.yaml.tmpl. Dex REFUSES TO
      # START with a sessions config and this unset ("sessions config requires
      # sessions to be enabled"), so the two must move together.
      #
      # Turning it on gives Dex a real `dex_session` browser cookie, which is
      # what makes it an OP you can log out of.
      DEX_SESSIONS_ENABLED: "true"
      # Trust the mesh CA IN ADDITION TO the image's public bundle. The Local
      # Account connector's issuer is pinned on-box (extra_hosts below), where
      # TLS is the mesh certificate Caddy serves through `gateway_tls`, not a
      # publicly-trusted one.
      #
      # SSL_CERT_DIR and NOT SSL_CERT_FILE: Go keeps its certFiles and replaces
      # only certDirectories, so a directory ADDS roots while SSL_CERT_FILE would
      # REPLACE the image's bundle — and a drop-in connector whose issuer is
      # genuinely off-box still needs the public roots.
      #
      # Relies on the image keeping a bundle at one of Go's default certFiles
      # paths. Verified for the digest pinned above:
      # /etc/ssl/certs/ca-certificates.crt. RE-VERIFY ON REPIN.
      SSL_CERT_DIR: "/ca"
    # KEEP THE CONNECTOR BACK-CHANNEL ON THE BOX. ensure-dex.sh renders the Local
    # Account connector with `issuer: https://local-auth-${DOMAIN}`, and Dex does
    # discovery, the code exchange and the key fetch against that public
    # hostname. Resolved publicly, those calls leave the box, cross the gateway
    # and re-enter this same machine — so Dex could not open the connector until
    # the public route was registered (the cold-boot crash loop), and login
    # depended on a path that has nothing to do with this box's own health.
    #
    # The issuer STRING does not change, so Authelia's discovery document still
    # matches and every redirect the browser sees is unchanged. Only the lookup
    # moves. Plain HTTP is not an alternative: the scheme is part of the issuer.
    extra_hosts:
      - "local-auth-${DOMAIN}:host-gateway"
    volumes:
      # The mesh CA that SSL_CERT_DIR points at — written there by
      # mesh-router-agent (CA_CERT_PATH, mesh stack), in a directory of its own so
      # the mesh private key never travels with it.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/ca:/ca:ro
      # config.yaml (rendered) + dex.db (sqlite). This is CACHE, not precious
      # data — see the recovery note in scripts/self-check/ensure-dex.sh.
      - ${DATA_ROOT:-/DATA}/AppData/auth/dex:/data
      # Custom login frontend, overlaid onto the stock image. ensure-dex.sh (via
      # tools/provision-dex-frontend.sh) renders these from the template's
      # dex-theme/ before the stack comes up. Docker materialises a MISSING
      # bind-mount source as a DIRECTORY, and a directory where login.html
      # belongs breaks `dex` permanently — which is why that tool also runs from
      # ensure-auth-stack.sh.
      #
      # The frontend lives INSIDE the dex data dir (dex/frontend), not beside it:
      # same owner and lifecycle, and Dex ignores it under /data.
      - ${DATA_ROOT:-/DATA}/AppData/auth/dex/frontend/templates/login.html:/srv/dex/web/templates/login.html:ro
      - ${DATA_ROOT:-/DATA}/AppData/auth/dex/frontend/templates/header.html:/srv/dex/web/templates/header.html:ro
      - ${DATA_ROOT:-/DATA}/AppData/auth/dex/frontend/themes/mesh:/srv/dex/web/themes/mesh:ro
    expose:
      - "5556"   # OIDC web endpoints (Caddy terminates TLS), bound on pcs
      - "5557"   # gRPC client-mgmt API — UNAUTHENTICATED, bound to dex-internal only
    networks:
      pcs: null
      # gRPC (5557) is bound to `dex-grpc` in config.yaml, so it is reachable
      # ONLY by containers on dex-internal (just auth-registrar).
      #
      # THE ALIAS IS THE WHOLE MECHANISM, and it must stay network-scoped. Dex is
      # multi-homed, so binding to its own container name is ambiguous — Docker's
      # embedded DNS answers from the *querying* container's perspective and can
      # hand back the `pcs`-side address, which would publish an unauthenticated
      # client-minting API to every app on the box. An alias declared here and
      # nowhere else exists in exactly one network's DNS scope, so it has exactly
      # one A record and `net.Listen` can only bind to the dex-internal interface.
      #
      # This replaced a pinned ipv4_address (172.31.7.2 on a /29). That address
      # was also the first one Docker's IPAM hands out dynamically, so any cycle
      # where auth-registrar attached while Dex was between restarts stole it and
      # wedged Dex forever on "Address already in use". There is no pinned address
      # left to collide over; do not reintroduce one.
      dex-internal:
        aliases:
          - dex-grpc
    # No depends_on: authelia is in this stack but Dex must not block on it, and
    # Dex retries a connector's back-channel on use, so cold-boot ordering
    # resolves itself.
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 5556}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 5556}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 5556}}"

  # =============================================================================
  # AUTHELIA - local-account IdP, federated by Dex as the "Local Account" connector
  # Owns the credential that used to live in CasaOS. Exactly ONE OIDC client (Dex);
  # per-app clients stay on Dex's gRPC path via auth-registrar. Serves its own
  # login UI at local-auth-${DOMAIN}, which carries the built-in "Reset password?"
  # link and drives the email reset through the smtp relay in the mesh stack.
  # Config + secrets + users_database.yml are provisioned by
  # scripts/self-check/ensure-authelia.sh into ${DATA_ROOT}/AppData/auth/authelia/.
  # =============================================================================
  authelia:
    # NEVER LOWER THIS PIN. Authelia migrates db.sqlite forward on every start and
    # an older binary cannot open the result — it exits with a misleading "the
    # configured encryption key does not appear to be valid for this database".
    # The floating 4.39 tag took boxes to 4.39.21/.22 (schema 25-28), and the
    # 4.39.20 pin that followed took every one of them offline. 4.39.23 added
    # schema 29, so nothing below 4.39.23 is safe for the fleet any more.
    # ensure-auth-stack.sh raises a pin that is behind a box's database, but that
    # is a safety net, not permission. Keep AUTHELIA_IMAGE in
    # self-check/ensure-authelia.sh and tools/authelia-user-manager.sh in step.
    image: authelia/authelia:4.39.25
    container_name: authelia
    hostname: authelia
    cpu_shares: 80
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset
    volumes:
      # configuration.yml (rendered) + db.sqlite + users_database.yml + secrets.
      # Unlike the dex dir this holds the local account — back it up.
      - ${DATA_ROOT:-/DATA}/AppData/auth/authelia:/config
    expose:
      - "9091"
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed). Distinct host from Dex's
      # auth-${DOMAIN}: Dex is the broker, Authelia is the connector behind it.
      caddy_0: local-auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9091}}"
      # nip.io variant — REQUIRED: the CF worker rewrites Host to nip.io, so that
      # is the route CF traffic matches, and Dex's back-channel needs it to resolve.
      caddy_1: local-auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 9091}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: local-auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 9091}}"

  # =============================================================================
  # AUTH-REGISTRAR - OIDC client self-registration for PCS apps
  # Sidecars (e.g. the AppShield gate in the maison stack) POST their redirect
  # URIs to http://auth-registrar:9092/register on first login and get back
  # {client_id, client_secret, issuer_url}. Caller identity is derived from the
  # source IP via PTR lookup on the pcs network — client_id is never accepted as
  # input. Intentionally NOT publicly routable. In Dex mode it calls Dex's gRPC
  # CreateClient.
  #
  # STATELESS: the registrar's client-secret cache lives inside the container
  # (DEX_CLIENTS_DIR=/tmp/dex-clients) and is deliberately NOT persisted. Within a
  # container lifetime the cache makes re-registration idempotent (same secret);
  # after a restart it is empty and the registrar transparently rotates each
  # client's secret on its next /register. Apps re-register on every login, so
  # this is invisible.
  # =============================================================================
  auth-registrar:
    image: ghcr.io/yundera/mesh-auth:1.1.8
    container_name: auth-registrar
    hostname: auth-registrar
    cpu_shares: 40
    restart: unless-stopped
    environment:
      ISSUER_URL: https://auth-${DOMAIN}
      # The same issuer as reached from inside the box: Dex's own listener on
      # `pcs`, the one Caddy proxies auth-${DOMAIN} to. Returned from /register as
      # `internal_issuer_url`; an AppShield >= 3.1.0 gate sends its discovery,
      # code exchange and key fetch there instead of resolving the public
      # hostname. The issuer above stays the identity. `dex` and not the dex-grpc
      # alias: gates are on `pcs` only, and the web listener binds 0.0.0.0.
      INTERNAL_ISSUER_URL: http://dex:5556
      REGISTRAR_BACKEND: dex
      # Dex gRPC is reachable only on the isolated dex-internal net, via the
      # network-scoped `dex-grpc` alias declared on the dex service (no fixed
      # address needed — the registrar dials the alias).
      DEX_GRPC_ADDR: dex-grpc:5557
      # ephemeral in-container cache (NOT persisted) — see note above
      DEX_CLIENTS_DIR: /tmp/dex-clients
      # Allowed redirect-URI host suffixes (comma-separated). An app's permitted
      # hosts are <app>-<suffix> for each; the registrar verifies every requested
      # callback against this exact set. Must list the SAME suffixes the apps'
      # caddy_* labels use — the user domain plus the IP-based fallbacks.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      # The one app allowed to register callbacks on the BARE suffixes
      # (${DOMAIN} itself, not just <app>-${DOMAIN}) — i.e. whoever the root
      # domain reverse-proxies to in the Caddyfile.
      #
      # Deliberately the SAME variable that drives that Caddy block: "the app
      # that owns the bare hostname" and "the app the bare hostname routes to"
      # are then one fact rather than two settings that can drift.
      #
      # SINCE THE SPLIT the two read it in different projects, and they must be
      # recreated together. The self-check does that (both deploys regenerate
      # their .env from the mesh one), and so does scripts/tools/set-default-app.sh
      # — the action Mesh Console's "default app" editor calls (mesh-console
      # >= 1.2.0), which re-runs ensure-stack-up.sh then ensure-auth-stack.sh.
      #
      # It is a proxy upstream target, not an identity: `host.docker.internal`
      # is legal here and is not a container name. The registrar validates it
      # and falls back to "nobody owns the bare hosts" rather than guessing —
      # check the `root app:` line in `docker logs auth-registrar` if a login on
      # the bare domain still lands on <app>-${DOMAIN}.
      #
      # Needs mesh-auth >= 1.1.4; older images ignore this and apps keep the
      # pre-existing bounce-to-<app>-${DOMAIN} behaviour.
      ROOT_CLIENT_ID: "${DEFAULT_SERVICE_HOST:-maison}"
      # Where an owner finishes setting the box up. While Dex is absent (no
      # connector yet — see dex_wanted in scripts/library/common.sh) /register
      # answers 503 login_unavailable with this URL, and every AppShield gate
      # (>= 3.2.0) shows a "finish setup" link on its sign-in-unavailable page.
      # Empty on a stock box: install.sh claims the account, so there is nothing
      # to finish in a browser. Needs mesh-auth >= 1.1.8.
      SETUP_URL: "${SETUP_URL:-}"
    expose:
      - "9092"
    networks:
      pcs: null            # /register from app sidecars + PTR attestation
      dex-internal: null   # gRPC to Dex
    # NO depends_on: dex. Dex is absent while it has no connector (dex_wanted), and
    # a depends_on would make every `up` of this stack start it again. The
    # registrar dials Dex lazily and answers 503 login_unavailable while it is gone.

  # =============================================================================
  # AUTH-CONSOLE — this stack's web UI (Yundera/auth-console): Account (the local
  # Authelia users) and Access (host accounts, SSH keys, login history).
  #
  # SECURITY: auth-console-app holds the Docker socket (it runs its host actions
  # as a one-shot privileged `auth-console-runner` in the host's namespaces), so it
  # is root-equivalent on the host. It is reachable only through its gate: NEVER
  # add `ports:` or caddy labels to it. The app trusts only the HS256
  # X-AppShield-Assertion the gate signs with AUTH_CONSOLE_ASSERTION_SECRET —
  # every container on `pcs` can reach it directly, so plain X-Auth-* / Remote-*
  # headers prove nothing — and checks the admin group per route itself.
  #
  # NO OIDC_REQUIRED_GROUPS, unlike mesh-console: a non-admin account must reach
  # its own Account page. The admin-only routes answer 403 in the app.
  #
  # NAMES ARE LOAD-BEARING: the registrar derives the gate's client_id from its
  # container name, and the gate's APP_NAME (from its hostname) is the assertion
  # audience — so the gate owns `auth-console` and the backend takes `-app`.
  #
  # AUTH_CONSOLE_ASSERTION_SECRET is minted into the mesh .env by
  # ensure-auth-stack.sh right before the deploy; deleting it re-mints it and
  # only logs everyone out of this console.
  # =============================================================================
  auth-console:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: auth-console
    hostname: auth-console
    restart: unless-stopped
    # Unprivileged: the gate needs nothing but its own /data. ensure-auth-stack.sh
    # creates gate-data and gives it to this uid before the stack comes up — left
    # to Docker the directory would be root-owned, and a non-root gate then fails
    # to persist sessions without saying so ("[session] save failed: permission
    # denied", every login forgotten on restart).
    user: "65534:65534"
    cpu_shares: 40
    mem_limit: 128m
    expose:
      - "80"
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Fallback only — the registrar's own REDIRECT_HOST_SUFFIXES decides. Keep it
      # matching the caddy_* labels below.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "auth-console-app"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      SESSION_DURATION_HOURS: "720"
      # Signs the identity assertion for auth-console-app, and verifies the control
      # tokens it sends back (POST /nhl-auth/sessions/revoke when an account is
      # deleted or its password reset).
      IDENTITY_ASSERTION_SECRET: "${AUTH_CONSOLE_ASSERTION_SECRET}"
      # The only path that answers without a login: a liveness probe, no data.
      ALLOWED_PATHS: "api/health"
    # The OIDC back-channel stays on the box with nothing configured here:
    # auth-registrar hands the gate `internal_issuer_url` (http://dex:5556) and
    # AppShield >= 3.1.0 sends its discovery, token and JWKS calls there. No
    # extra_hosts pin, no SSL_CERT_DIR, no mesh CA mount — see the mesh-console
    # gate in the mesh stack's docker-compose.yml.
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/auth/auth-console/gate-data:/data
    depends_on:
      - auth-console-app
      - auth-registrar
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-console-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: auth-console-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: auth-console-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

  auth-console-app:
    # Publish the tag before moving this pin: a tag missing from ghcr costs every
    # self-check the pull backoff.
    image: ghcr.io/yundera/auth-console:1.1.0
    container_name: auth-console-app
    hostname: auth-console-app
    restart: unless-stopped
    # Root: it reads the mesh .env (mode 600) and talks to the Docker socket,
    # which already makes it root-equivalent on the host.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    environment:
      IDENTITY_ASSERTION_SECRET: "${AUTH_CONSOLE_ASSERTION_SECRET}"
      IDENTITY_ASSERTION_AUDIENCE: "auth-console"
      APPSHIELD_GATE_URL: "http://auth-console"
      # The mesh root as the HOST sees it. Host actions run in the host's mount
      # namespace, so they need this path, not the /host-root mount below.
      HOST_ROOT: "${DATA_ROOT:-/DATA}/AppData/mesh"
      # The live scripts (ensure-template-sync.sh propagates scripts/ here), not
      # the pristine template/ copy.
      HOST_SCRIPTS: "${DATA_ROOT:-/DATA}/AppData/mesh/scripts"
      # Both empty unless the box is run by an operator, and inert when empty.
      # OPERATOR_API is the operator's control-plane base URL: with it the Access
      # page shows, tags and can toggle the operator's support SSH key
      # (GET <OPERATOR_API>/support/ssh-key). TRUSTED_PUBKEY_HOST_SUFFIXES is the
      # comma-separated list of key-comment host suffixes the page marks as
      # trusted. Set in the mesh .env by whatever provisions the box.
      OPERATOR_API: "${OPERATOR_API:-}"
      TRUSTED_PUBKEY_HOST_SUFFIXES: "${TRUSTED_PUBKEY_HOST_SUFFIXES:-}"
    expose:
      - "8080"   # NEVER `ports:` — see the security note above
    networks:
      pcs: null
    volumes:
      # Read-only: the .env (DOMAIN, LOCAL_ADMIN_USER) and which scripts exist.
      # Every write goes through a host action, never through this mount.
      - ${DATA_ROOT:-/DATA}/AppData/mesh:/host-root:ro
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  # Created by ensure_pcs_network, never by a stack — see the header.
  pcs:
    name: pcs
    external: true
  # Isolated gRPC-only net for the auth-registrar <-> Dex client-management API.
  # internal: true → no egress (Dex's egress comes from the pcs network it is also
  # on). App containers live only on pcs, so they cannot reach Dex's gRPC port
  # (5557), which is bound to the `dex-grpc` alias on this net.
  #
  # OWNED BY THIS PROJECT, unlike pcs: both ends of it are in this stack, and
  # nothing else may ever join it. It was created by the mesh project before the
  # split; ensure-auth-stack.sh removes that one once it is empty (adopt_network)
  # so compose recreates it with this project's labels.
  #
  # NO ipam BLOCK, DELIBERATELY. Addressing here is entirely dynamic: Dex is found
  # by its network-scoped alias, not by a pinned address, so there is no reserved
  # IP for the dynamic allocator to collide with and no subnet to keep clear of
  # other host docker networks. See the alias note on the dex service.
  dex-internal:
    name: dex-internal
    internal: true

# Tiles the stack in Maison's System grid: Maison refuses to stop or uninstall it
# (every login on the box goes through it) and the nightly backup skips it. The
# tile opens auth-console; webui-host is the only field Maison substitutes
# ${DOMAIN} into, and it must match the gate's caddy_0.
x-compose-app:
  schema_version: 2
  id: auth
  title: Auth
  category: pcs
  developer: Yundera Team
  view: system
  webui-host: auth-console-${DOMAIN}
  webui-scheme: https
  webui-path: /
