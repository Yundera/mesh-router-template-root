# =============================================================================
# TERMINAL STACK — the Yundera AppStore's Terminal app, shipped as a system app.
#
# COPIED FROM Yundera/AppStore Apps/Terminal/docker-compose.yml — the services below are
# that file's, unchanged. Only the trailing metadata differs: `x-compose-app` with
# `view: system` here, in place of the store's `x-casaos`. Change the app in the store
# and copy it back; do not let the two drift. The app configures itself (its own SSH
# key, at container start — see TERMINAL_SETUP and the store's rationale.md), so the
# deploying script only supplies the variables and runs `up`.
#
# Deployed to ${DATA_ROOT}/AppData/terminal by scripts/self-check/ensure-terminal-stack.sh,
# which writes the .env beside it: the mesh .env plus the APP_* keys (and
# TERMINAL_USER) this store compose reads. DO NOT edit the deployed copy — it is
# overwritten on every self-check.
# =============================================================================
name: terminal

services:
  terminal:
    # >= 3.1.0 keeps the OIDC back-channel on the box: auth-registrar hands the gate
    # `internal_issuer_url` and its discovery, token and JWKS calls go there instead of
    # out through the public route.
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: terminal
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: terminal
    restart: unless-stopped
    expose:
      - "80"
    labels:
      caddy_0: terminal-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: terminal-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: terminal-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    user: "0:0"
    environment:
      BACKEND_HOST: "terminal-ttyd"
      BACKEND_PORT: "7681"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      SESSION_DURATION_HOURS: "720"
    # The gate's sessions. Without a mount they live in the container and every
    # recreate (an update, a self-check redeploy) logs the user out. Root above, so
    # the Docker-created directory is writable.
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/terminal/gate-data:/data
    depends_on:
      - terminal-ttyd
    networks:
      # On `pcs` because Caddy must reach it, and on the app's own
      # network because that is where its backend lives.
      - pcs
      - terminal-internal
    cpu_shares: 80

  terminal-ttyd:
    image: tsl0922/ttyd:1.7.7
    container_name: terminaltty
    restart: unless-stopped
    user: "root"
    # The shell is an SSH session to admin@localhost, opened from inside the host's
    # namespaces — the same session `ssh admin@<server>` gives, so hostname, network,
    # processes, tty, login shell, sudo and systemd are all the host's. See rationale.md.
    #
    # Two steps, at every container start:
    #   1. TERMINAL_SETUP (below) runs in the HOST's filesystem (nsenter --mount) and
    #      makes sure the app's own key exists and is authorized for `admin`. The app
    #      configures itself; nothing has to be provisioned on the host beforehand.
    #   2. ttyd starts, and for each browser session runs the host's own `ssh` from
    #      inside the host's namespaces. The key and known_hosts paths are HOST paths.
    entrypoint:
      - /bin/sh
      - -c
      - 'nsenter --target=1 --mount -- /bin/sh -c "$$TERMINAL_SETUP" && exec "$$@"'
      - terminal
    command:
      - ttyd
      - --writable
      - --client-option
      - enableZmodem=true
      - --client-option
      - enableSixel=false
      - --client-option
      - enableTrzsz=false
      - --client-option
      - scrollback=5000
      - --terminal-type
      - xterm-256color
      - nsenter
      - --target=1
      - --mount
      - --uts
      - --ipc
      - --net
      - --pid
      - --
      - ssh
      - -F
      - /dev/null
      - -i
      - ${DATA_ROOT:-/DATA}/AppData/terminal/ssh/id_ed25519
      - -o
      - IdentitiesOnly=yes
      - -o
      - UserKnownHostsFile=${DATA_ROOT:-/DATA}/AppData/terminal/ssh/known_hosts
      - -o
      - HostKeyAlias=localhost
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - LogLevel=ERROR
      - -tt
      - ${TERMINAL_USER:-admin}@localhost
    environment:
      # Runs as root in the host's mount namespace, with the host's /bin/sh and tools.
      # Idempotent: it only rewrites what is missing or wrong.
      #   - key: generated once, kept in this app's own data folder (root-only);
      #   - authorized_keys: exactly ONE line, identified by the `yundera-terminal`
      #     comment and restricted to from="127.0.0.1,::1" — useless anywhere but on
      #     this box. Every other line in the file is left as it is;
      #   - known_hosts: the host's own host keys, so the client checks strictly.
      # TERMINAL_USER picks the host account the session logs into. It defaults to
      # `admin`, the PCS sudoer; a deployment without one (a self-hosted mesh box)
      # passes its own. It must be able to log in over SSH with a key.
      TERMINAL_SETUP: |
        set -eu
        D="${DATA_ROOT:-/DATA}/AppData/terminal/ssh"
        U="${TERMINAL_USER:-admin}"
        M=yundera-terminal
        H="$$(getent passwd "$$U" | cut -d: -f6)"
        if [ -z "$$H" ]; then echo "terminal: no '$$U' user on this host" >&2; exit 1; fi
        mkdir -p "$$D"
        chmod 700 "$$D"
        if [ ! -s "$$D/id_ed25519" ] || [ ! -s "$$D/id_ed25519.pub" ]; then
          rm -f "$$D/id_ed25519" "$$D/id_ed25519.pub"
          ssh-keygen -q -t ed25519 -N "" -C "$$M" -f "$$D/id_ed25519"
        fi
        AK="$$H/.ssh/authorized_keys"
        L="from=\"127.0.0.1,::1\",no-agent-forwarding,no-port-forwarding,no-X11-forwarding $$(cut -d' ' -f1,2 "$$D/id_ed25519.pub") $$M"
        if [ "$$(grep -E "[[:space:]]$$M\$$" "$$AK" 2>/dev/null || true)" != "$$L" ]; then
          mkdir -p "$$H/.ssh"
          chmod 700 "$$H/.ssh"
          chown "$$U:" "$$H/.ssh"
          T="$$(mktemp "$$H/.ssh/.authorized_keys.XXXXXX")"
          grep -v -E "[[:space:]]$$M\$$" "$$AK" > "$$T" 2>/dev/null || true
          printf '%s\n' "$$L" >> "$$T"
          chmod 600 "$$T"
          chown "$$U:" "$$T"
          mv -f "$$T" "$$AK"
        fi
        for f in /etc/ssh/ssh_host_*_key.pub; do
          printf 'localhost %s\n' "$$(cut -d' ' -f1,2 "$$f")"
        done > "$$D/known_hosts.tmp"
        mv -f "$$D/known_hosts.tmp" "$$D/known_hosts"
    networks:
      # App-private: reached only by this app's own services, so it
      # has no business on the shared network.
      - terminal-internal
    cpu_shares: 70
    # Only ttyd and the ssh client count against this — the shell itself runs in the
    # host's sshd session, outside this container.
    mem_limit: 128m
    # Entering PID 1's namespaces needs both. See rationale.md.
    pid: host
    privileged: true

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between this app's own services.
  terminal-internal:
    driver: bridge

# Tiles the stack in Maison's System grid: Maison refuses to stop or uninstall it and the
# nightly backup skips it. `webui-host` must match caddy_0 above.
x-compose-app:
  schema_version: 2
  id: terminal
  title: Terminal
  category: pcs
  developer: Yundera Team
  view: system
  webui-host: terminal-${APP_DOMAIN}
  webui-scheme: https
  webui-path: /
  # Nothing here is worth a snapshot (an SSH key the app regenerates), and backing an
  # app up stops it — `skip` also closes the manual Backups-tab path.
  backup:
    skip: true
